# Builds the solution and runs the tests for each pull request and each push to main.
name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Install the SDK that global.json pins.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
